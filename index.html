<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controles y Electronica Maipu</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1f6feb"><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mu:#6b7690;--ac:#1f6feb;--bd:#dde3ee;--ef:#16a34a;--tr:#7c3aed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192032;--tx:#eef2fb;--mu:#98a3bd;--ac:#4c8dff;--bd:#2a3452;--ef:#4ade80;--tr:#a78bfa}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192032;--tx:#eef2fb;--mu:#98a3bd;--ac:#4c8dff;--bd:#2a3452;--ef:#4ade80;--tr:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0;text-align:center}
.mes{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.mes b{font-size:18px;text-transform:capitalize;min-width:150px;text-align:center}
.mes button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:50%;width:34px;height:34px;font-size:16px}
.tot{background:var(--ac);color:#fff;border-radius:16px;padding:14px;text-align:center;margin:12px 0}
.tot small{opacity:.85;display:block}.tot div{font-size:30px;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--tx);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font-size:15px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.add{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}.row .t{font-weight:600}.row .s{font-size:12px;color:var(--mu)}
.row .m{font-weight:700;white-space:nowrap}.x{background:none;border:0;color:#dc2626;font-size:18px;padding:4px 8px}
.h{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-bottom:4px}
.ef{color:var(--ef)}.tr{color:var(--tr)}.vac{color:var(--mu);text-align:center;padding:10px;font-size:14px}.sub{font-size:12px;color:var(--mu);margin-bottom:6px}label.chk{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--tx);font-size:16px}.chk input{width:22px;height:22px}.b{margin-top:5px;border:0;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}.b.si{background:#16a34a22;color:var(--ef)}.b.no{background:#dc262622;color:#dc2626}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}#login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}body.lock #login{display:flex}body.lock .w{display:none}#est{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;background:var(--tx);color:var(--bg);font-size:13px;padding:6px;z-index:5}#est:empty{display:none}</style></head><body class="lock"><div id="est"></div><div id="login"><form id="lf"><img src="/icon-192.png" width="72" height="72" alt="" style="display:block;margin:0 auto 6px;border-radius:16px"><h1>Controles y Electronica Maipu</h1><label>Usuario</label><input id="lu" autocomplete="username" autocapitalize="none" required><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password" required><div id="lerr" class="vac" style="color:#dc2626"></div><button class="add" type="submit" style="margin-top:4px">Entrar</button></form></div><div class="w">
<h1>Controles y Electronica Maipu</h1>
<div class="mes"><button id="pv">‹</button><b id="mes"></b><button id="nx">›</button></div>
<div class="tot"><small>Total general del mes</small><div id="tot">$0</div></div>
<div class="tabs"><button id="t1" class="on">Registrar</button><button id="t2">General</button><button id="t3">Año</button></div>

<div id="v1">
<div class="card">
<label>Tipo</label>
<div class="seg" id="sTipo"><button data-v="Venta" class="on">Venta</button><button data-v="Reparación">Reparación</button></div>
<label>Fecha</label><input type="date" id="fecha">
<label>Método de pago</label>
<div class="seg" id="sMet"><button data-v="Efectivo" class="on">Efectivo</button><button data-v="Transferencia">Transferencia</button></div>
<label>Monto ($)</label><input type="number" id="monto" inputmode="numeric" min="0" placeholder="0">
<label class="chk"><input type="checkbox" id="fact"> Facturado</label><button class="add" id="add">Agregar</button>
</div>
<div class="card"><div class="h"><span>Movimientos del mes</span></div><div id="lista"></div></div>
</div>

<div id="v3" hidden><div class="mes" style="margin-bottom:12px"><button id="yp">‹</button><b id="anio"></b><button id="yn">›</button></div><div class="card"><div class="h"><span>Total del año</span><span id="ya"></span></div><div id="ym"></div></div></div>
<div id="v2" hidden><div class="seg" id="sFil" style="margin-bottom:12px"><button data-v="Todos" class="on">Todos</button><button data-v="Venta">Ventas</button><button data-v="Reparación">Reparaciones</button></div>
<div class="card"><div class="h ef"><span>💵 Efectivo</span><span id="te"></span></div><div class="sub" id="se"></div><div id="le"></div></div>
<div class="card"><div class="h tr"><span>🏦 Transferencia</span><span id="tt"></span></div><div class="sub" id="st"></div><div id="lt"></div></div>
</div>
</div>
<div class="w" style="padding-top:0"><div class="card"><div class="h"><span>Resumen por semana</span></div><div class="sub">Ventas y reparaciones del mes seleccionado (lunes a domingo)</div><div id="sem"></div></div><div class="card"><div class="h"><span>Planilla y respaldo</span></div><button class="add" id="xls" style="margin-top:6px">📊 Descargar planilla (Excel)</button><div class="seg" style="margin-top:8px"><button id="resp">💾 Descargar respaldo</button><button id="cb">📂 Cargar respaldo</button></div><input type="file" id="carg" accept=".json,application/json" hidden><button class="add" id="out" style="background:var(--mu);margin-top:14px">Cerrar sesión</button></div></div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CL');
let data=[],listo=false;
const save=()=>{if(!listo)return;fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>{if(r.status===401)lock(true);else if(!r.ok)st('⚠ No se pudo guardar')}).catch(()=>st('⚠ Sin conexión: no se guardó'))};
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let cur=hoy().slice(0,7),tipo='Venta',met='Efectivo',fil='Todos',anio=+hoy().slice(0,4);
$('fecha').value=hoy();
function seg(id,cb){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.v)}}
seg('sTipo',v=>tipo=v);seg('sMet',v=>met=v);seg('sFil',v=>{fil=v;render()});
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('t3').onclick=()=>tab(3);$('yp').onclick=()=>{anio--;render()};$('yn').onclick=()=>{anio++;render()};
function tab(n){[1,2,3].forEach(i=>{$('v'+i).hidden=n!=i;$('t'+i).classList.toggle('on',n==i)})}
function mover(d){let[y,m]=cur.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}cur=y+'-'+String(m).padStart(2,'0');render()}
$('pv').onclick=()=>mover(-1);$('nx').onclick=()=>mover(1);
const st=t=>{$('est').textContent=t;clearTimeout(st.t);st.t=setTimeout(()=>$('est').textContent='',4000)};
function bajar(nom,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nom;document.body.appendChild(a);a.click();a.remove()}
function unir(a){const ids=new Set(data.map(x=>x.id));a.filter(x=>x&&x.id&&+x.monto>0&&/^\d{4}-\d{2}-\d{2}/.test(x.fecha)).forEach(x=>{if(!ids.has(+x.id))data.push({id:+x.id,tipo:x.tipo==='Reparación'?'Reparación':'Venta',fecha:String(x.fecha).slice(0,10),met:x.met==='Transferencia'?'Transferencia':'Efectivo',monto:+x.monto,fact:!!x.fact})});save();render()}
$('xls').onclick=()=>{const L=[...data].sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.id-b.id);bajar('ventas-reparaciones-'+hoy()+'.xlsx',xlsx(L),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')};
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=-1;for(const x of b)c=crcT[(c^x)&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const E=new TextEncoder(),P=[],C=[];let off=0;
for(const[n,t]of files){const nm=E.encode(n),d=E.encode(t),c=crc(d),h=new DataView(new ArrayBuffer(30)),g=new DataView(new ArrayBuffer(46));
h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,nm.length,true);g.setUint32(42,off,true);
P.push(h.buffer,nm,d);C.push(g.buffer,nm);off+=30+nm.length+d.length}
const cs=C.reduce((t,b)=>t+b.byteLength,0),e=new DataView(new ArrayBuffer(22));
e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
return new Blob([...P,...C,e.buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xlsx(L){const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),col='ABCDEF',
c=(r,i,v,s)=>typeof v==='number'?`<c r="${col[i]}${r}" s="${s}"><v>${v}</v></c>`:`<c r="${col[i]}${r}" t="inlineStr" s="${s}"><is><t>${X(v)}</t></is></c>`;
let rows='<row r="1">'+['Fecha','Mes','Tipo','Método de pago','Monto','Facturado'].map((h,i)=>c(1,i,h,1)).join('')+'</row>';
L.forEach((x,k)=>{const[y,m,d]=x.fecha.split('-'),r=k+2;rows+=`<row r="${r}">`+c(r,0,Date.UTC(y,m-1,d)/864e5+25569,4)+c(r,1,m+'/'+y,0)+c(r,2,x.tipo,0)+c(r,3,x.met,0)+c(r,4,x.monto,2)+c(r,5,x.fact?'Sí':'No',0)+'</row>'});
const t=L.length+3;rows+=`<row r="${t}">`+c(t,0,'TOTAL',1)+(L.length?`<c r="E${t}" s="3"><f>SUM(E2:E${L.length+1})</f></c>`:c(t,4,0,3))+'</row>';
const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',M='http://schemas.openxmlformats.org/',R=M+'officeDocument/2006/relationships';
const w=[13,10,14,17,14,12].map((n,i)=>`<col min="${i+1}" max="${i+1}" width="${n}" customWidth="1"/>`).join('');
return zip([
['[Content_Types].xml',H+`<Types xmlns="${M}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
['_rels/.rels',H+`<Relationships xmlns="${M}package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
['xl/workbook.xml',H+`<workbook xmlns="${M}spreadsheetml/2006/main" xmlns:r="${R}"><sheets><sheet name="Movimientos" sheetId="1" r:id="rId1"/></sheets></workbook>`],
['xl/_rels/workbook.xml.rels',H+`<Relationships xmlns="${M}package/2006/relationships"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
['xl/styles.xml',H+`<styleSheet xmlns="${M}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="5"><xf/><xf fontId="1" applyFont="1"/><xf numFmtId="3" applyNumberFormat="1"/><xf fontId="1" numFmtId="3" applyFont="1" applyNumberFormat="1"/><xf numFmtId="14" applyNumberFormat="1"/></cellXfs></styleSheet>`],
['xl/worksheets/sheet1.xml',H+`<worksheet xmlns="${M}spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${w}</cols><sheetData>${rows}</sheetData></worksheet>`]])}

$('resp').onclick=()=>bajar('respaldo-'+hoy()+'.json',JSON.stringify(data),'application/json');
$('cb').onclick=()=>$('carg').click();
$('carg').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const a=JSON.parse(t);if(!Array.isArray(a))throw 0;unir(a);st('✓ Respaldo cargado')}catch(_){st('Archivo no válido')}});e.target.value=''};
$('add').onclick=()=>{const m=parseFloat($('monto').value);if(!m||m<=0||!$('fecha').value){alert('Completá fecha y monto');return}
data.push({id:Date.now(),tipo,fecha:$('fecha').value,met,monto:m,fact:$('fact').checked});save();cur=$('fecha').value.slice(0,7);anio=+cur.slice(0,4);$('monto').value='';$('fact').checked=false;render()};
function del(id){if(confirm('¿Eliminar este movimiento?')){data=data.filter(x=>x.id!==id);save();render()}}
function fila(x){const [y,m,d]=x.fecha.split('-');const div=document.createElement('div');div.className='row';
div.innerHTML='<div><div class="t"></div><div class="s"></div><button class="b"></button></div><div style="display:flex;align-items:center"><span class="m"></span><button class="x">✕</button></div>';
div.querySelector('.t').textContent=x.tipo;div.querySelector('.s').textContent=d+'/'+m+'/'+y+' · '+x.met;
div.querySelector('.m').textContent=fmt(x.monto);const b=div.querySelector('.b');b.className='b '+(x.fact?'si':'no');b.textContent=x.fact?'✓ Facturado':'✗ Sin facturar';b.onclick=()=>{x.fact=!x.fact;save();render()};div.querySelector('.x').onclick=()=>del(x.id);return div}
function llenar(el,arr){el.innerHTML='';if(!arr.length){el.innerHTML='<div class="vac">Sin movimientos</div>';return}arr.forEach(x=>el.appendChild(fila(x)))}
function render(){
const[y,m]=cur.split('-');$('mes').textContent=new Date(y,m-1,1).toLocaleDateString('es-CL',{month:'long',year:'numeric'});
const L=data.filter(x=>x.fecha.startsWith(cur)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id-a.id);
const Em=L.filter(x=>x.met==='Efectivo'),Tm=L.filter(x=>x.met==='Transferencia'),s=a=>a.reduce((t,x)=>t+x.monto,0),sb=a=>'Ventas '+fmt(s(a.filter(x=>x.tipo==='Venta')))+' · Reparaciones '+fmt(s(a.filter(x=>x.tipo!=='Venta'))),ok=x=>fil==='Todos'||x.tipo===fil,E=Em.filter(ok),T=Tm.filter(ok);
$('tot').textContent=fmt(s(L));$('te').textContent=fmt(s(E));$('tt').textContent=fmt(s(T));$('se').textContent=sb(Em);$('st').textContent=sb(Tm);
llenar($('lista'),L);llenar($('le'),E);llenar($('lt'),T);
$('anio').textContent=anio;const box=$('ym');box.innerHTML='';let ty=0;
for(let i=1;i<=12;i++){const k=anio+'-'+String(i).padStart(2,'0'),a=data.filter(x=>x.fecha.startsWith(k)),e=s(a.filter(x=>x.met==='Efectivo')),t=s(a.filter(x=>x.met==='Transferencia'));ty+=e+t;const r=document.createElement('div');r.className='row';r.innerHTML='<div><div class="t" style="text-transform:capitalize"></div><div class="s"></div></div><span class="m"></span>';r.querySelector('.t').textContent=new Date(anio,i-1,1).toLocaleDateString('es-CL',{month:'long'});r.querySelector('.s').textContent='Efectivo '+fmt(e)+' · Transf. '+fmt(t);r.querySelector('.m').textContent=fmt(e+t);box.appendChild(r)}
$('ya').textContent=fmt(ty);
const wb=$('sem');wb.innerHTML='';const ult=new Date(y,m,0).getDate();let ini=1,n=1;
while(ini<=ult){const dow=(new Date(y,m-1,ini).getDay()+6)%7,fin=Math.min(ult,ini+(6-dow)),a=L.filter(x=>{const d=+x.fecha.slice(8,10);return d>=ini&&d<=fin}),r=document.createElement('div');r.className='row';r.innerHTML='<div><div class="t"></div><div class="s"></div></div><span class="m"></span>';r.querySelector('.t').textContent='Semana '+n+' (días '+ini+' al '+fin+')';r.querySelector('.s').textContent=sb(a);r.querySelector('.m').textContent=fmt(s(a));wb.appendChild(r);ini=fin+1;n++}
}

const lock=b=>document.body.classList.toggle('lock',b);
async function cargar(){try{const r=await fetch('/api/data',{cache:'no-store'});if(r.status===401){lock(true);return}if(!r.ok)throw 0;data=(await r.json()).data||[];listo=true;render()}catch(e){st('⚠ No se pudieron cargar los datos. Recargá la página.')}}
function entrar(){lock(false);cargar()}
function iniciar(){fetch('/api/auth',{cache:'no-store'}).then(r=>r.ok?entrar():lock(true)).catch(()=>lock(true))}
$('lf').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('lu').value,pass:$('lp').value})});if(r.ok){$('lp').value='';entrar()}else $('lerr').textContent=r.status===429?'Demasiados intentos. Esperá unos minutos.':r.status===500?'La app no está configurada (faltan variables en Vercel).':'Usuario o contraseña incorrectos'}catch(_){$('lerr').textContent='Sin conexión'}};
$('out').onclick=async()=>{try{await fetch('/api/auth',{method:'DELETE'})}catch(_){}data=[];listo=false;render();lock(true)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&listo)cargar()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();iniciar();
</script></body></html>
